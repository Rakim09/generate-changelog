name: Shellcheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          arch="$(uname -m)"; case "$arch" in x86_64) a=x86_64;; aarch64) a=aarch64;; esac
          curl -fsSL -o /tmp/sc.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.$a.tar.xz"
          tar -xJf /tmp/sc.tar.xz -C /tmp
          echo "/tmp/shellcheck-v0.11.0" >> "$GITHUB_PATH"
          shellcheck --version

      - name: Run ShellCheck
        run: shellcheck generate-changelog simple_mr_changelog

      - name: Bash syntax check
        run: bash -n generate-changelog simple_mr_changelog
