name: Shellcheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: redhat-actions/shellcheck@v2

      - name: Bash syntax check
        run: for f in *.sh; do bash -n "$f"; done